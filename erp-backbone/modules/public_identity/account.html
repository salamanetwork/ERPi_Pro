<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERPi Pro · Customer Portal</title><style nonce="NONCE">PORTAL_THEME</style></head><body><main>
<header class="page-header"><span class="brand">ERPi Pro</span><button type="button" id="language" class="language" aria-label="العربية">العربية</button></header>
<div id="result" class="alert info" role="status" aria-live="polite" hidden></div>
<p id="loading" class="empty" data-i18n="loading">Loading your account…</p>
<section id="auth-view" class="auth-shell card" hidden aria-labelledby="auth-title">
<div class="card-intro"><h1 id="auth-title" data-i18n="login">Sign In</h1><p class="muted" data-i18n="intro">Your private customer space. Employee access is separate.</p></div>
<nav class="tabs" role="tablist" aria-label="Account options"><button type="button" id="tab-login" role="tab" data-mode="login" aria-controls="account" aria-selected="true" data-i18n="login">Sign In</button><button type="button" id="tab-register" role="tab" data-mode="register" aria-controls="account" aria-selected="false" data-i18n="register">Create Account</button><button type="button" id="tab-reset" role="tab" data-mode="password-reset/request" aria-controls="account" aria-selected="false" data-i18n="reset">Reset Password</button><button type="button" id="tab-resend" role="tab" data-mode="resend-verification" aria-controls="account" aria-selected="false" data-i18n="resend">Resend Verification</button></nav>
<form id="account" role="tabpanel" aria-labelledby="tab-login" novalidate>
<div class="field"><label for="space" data-i18n="site">Public site code</label><input id="space" name="space" required maxlength="50" placeholder="main-store" autocomplete="off" dir="ltr" aria-describedby="space-error"><small id="space-error" class="field-error"></small></div>
<div class="field" id="name-field" hidden><label for="display_name" data-i18n="name">Full name</label><input id="display_name" name="display_name" maxlength="120" autocomplete="name" data-placeholder="nameHint" placeholder="e.g., Walid Salama" aria-describedby="display_name-error"><small id="display_name-error" class="field-error"></small></div>
<div class="field"><label for="email" data-i18n="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username" placeholder="walid@example.com" dir="ltr" aria-describedby="email-error"><small id="email-error" class="field-error"></small></div>
<div class="field" id="password-field"><label for="password" data-i18n="password">Password</label><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" data-placeholder="passwordHint" placeholder="Your password" aria-describedby="password-help password-error"><small id="password-help" class="hint" hidden data-i18n="passwordRule">Use at least 12 characters.</small><small id="password-error" class="field-error"></small></div>
<button id="auth-submit" class="primary full" type="submit" data-i18n="login">Sign In</button>
</form></section>
<section id="member" hidden aria-label="Customer Portal">
<header class="portal-header card"><div class="identity"><h1 data-i18n="portal">Customer Portal</h1><p id="who"></p><div class="badges"><span id="active-site" class="badge"></span><span class="badge" data-i18n="boundary">Customer Portal · No employee access</span></div></div><div class="actions"><button id="refresh" type="button" class="secondary" data-i18n="refresh">Refresh Session</button><button id="logout" type="button" class="danger" data-i18n="logout">Logout</button><button id="logout-all" type="button" class="danger" data-i18n="logoutAll">Logout All</button></div></header>
<section class="card"><button id="business-open" type="button" data-i18n="business">My appointments, invoices and receipts</button><div id="business-data" aria-live="polite"></div></section>
<section class="card" aria-labelledby="files-title"><div class="section-header"><h2 id="files-title" data-i18n="privateFiles">Private Files</h2><button type="button" id="files" class="secondary" data-i18n="reloadFiles">Reload files</button></div>
<label class="dropzone" id="dropzone" for="file"><strong data-i18n="drop">Drop a file here or select a file</strong><span class="muted" data-i18n="limits">PNG, JPEG, WebP up to 5 MB · PDF up to 10 MB</span><input id="file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" aria-describedby="file-error"></label><small id="file-error" class="field-error"></small>
<div class="upload-row"><p id="chosen-file" class="muted" data-i18n="noFile">No file selected</p><button type="button" id="upload" class="primary" data-i18n="upload" disabled>Upload</button></div>
<div class="folder-tools"><label><span data-i18n="newFolder">New folder</span><input id="folder-name" maxlength="100"></label><button type="button" id="folder-create" data-i18n="createFolder">Create folder</button><label><span data-i18n="fileSearch">Search files</span><input type="search" id="folder-search"></label></div><div id="folder-list"></div><ul id="assets" class="file-list" aria-live="polite"></ul><p id="empty-files" class="empty" data-i18n="noFiles" hidden>No private files yet.</p></section></section>
<footer>ERPi Pro · <span data-i18n="portal">Customer Portal</span></footer></main><script nonce="NONCE">PORTAL_SCRIPT</script></body></html>
