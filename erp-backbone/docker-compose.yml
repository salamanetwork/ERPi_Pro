services:
  db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${ERP_POSTGRES_PASSWORD:?Set ERP_POSTGRES_PASSWORD}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD}
      ERP_INITIAL_DB_NAME: ${ERP_INITIAL_DB_NAME:-erp_backbone}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$ERP_DB_PASSWORD" psql -h 127.0.0.1 -U erp_app -d "$$ERP_INITIAL_DB_NAME" -Atqc "SELECT 1"']
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [data]

  app:
    image: erp-backbone:${ERP_RELEASE:-2.8.1}
    build: .
    restart: unless-stopped
    environment: &erp-environment
      DJANGO_SETTINGS_MODULE: backbone.production
      ERP_APP_MODE: ${ERP_APP_MODE:-production}
      ERP_HOST: ${ERP_HOST:?Set ERP_HOST}
      ERP_SECRET_KEY: ${ERP_SECRET_KEY:?Set ERP_SECRET_KEY}
      ERP_CUSTOMER_JWT_KEY: ${ERP_CUSTOMER_JWT_KEY:?Set ERP_CUSTOMER_JWT_KEY}
      ERP_PUBLIC_BASE_URL: ${ERP_PUBLIC_BASE_URL:?Set ERP_PUBLIC_BASE_URL}
      ERP_MFA_KEY: ${ERP_MFA_KEY:?Set ERP_MFA_KEY}
      ERP_CONNECTOR_KEY: ${ERP_CONNECTOR_KEY:-}
      ERP_HSTS_PRELOAD: ${ERP_HSTS_PRELOAD:-0}
      ERP_MFA_ALL: ${ERP_MFA_ALL:-0}
      ERP_MFA_ROLES: ${ERP_MFA_ROLES:-}
      ERP_DB_HOST: db
      ERP_DB_NAME: ${ERP_DB_NAME:-erp_backbone}
      ERP_DB_USER: erp_app
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD}
      ERP_MEDIA_ROOT: /srv/erp/media/${ERP_MEDIA_SUBDIR:-live}
      ERP_WEB_WORKERS: ${ERP_WEB_WORKERS:-3}
      ERP_WEB_THREADS: ${ERP_WEB_THREADS:-2}
      ERP_EXTRA_EXTENSIONS: ${ERP_EXTRA_EXTENSIONS:-}
      ERP_MARKETING_LIVE: ${ERP_MARKETING_LIVE:-0}
      ERP_MARKETING_HMAC_KEY: ${ERP_MARKETING_HMAC_KEY:-}
      ERP_MARKETING_PUBLIC_URL: ${ERP_MARKETING_PUBLIC_URL:-http://localhost:8001}
      ERP_MARKETING_TEST_RECIPIENTS: ${ERP_MARKETING_TEST_RECIPIENTS:-}
      ERP_MARKETING_RATE_EMAIL: ${ERP_MARKETING_RATE_EMAIL:-10}
      ERP_MARKETING_RATE_SMS: ${ERP_MARKETING_RATE_SMS:-10}
      ERP_MARKETING_RATE_WHATSAPP: ${ERP_MARKETING_RATE_WHATSAPP:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ERP_TWILIO_ACCOUNT_SID: ${ERP_TWILIO_ACCOUNT_SID:-}
      ERP_TWILIO_AUTH_TOKEN: ${ERP_TWILIO_AUTH_TOKEN:-}
      ERP_REDIS_URL: redis://redis:6379/0
      ERP_SMTP_ENABLED: ${ERP_SMTP_ENABLED:-0}
      ERP_SMTP_HOST: ${ERP_SMTP_HOST:-localhost}
      ERP_SMTP_PORT: ${ERP_SMTP_PORT:-587}
      ERP_SMTP_USER: ${ERP_SMTP_USER:-}
      ERP_SMTP_PASSWORD: ${ERP_SMTP_PASSWORD:-}
      ERP_SMTP_FROM: ${ERP_SMTP_FROM:-erp@localhost}
      ERP_SMTP_TLS: ${ERP_SMTP_TLS:-1}
    volumes:
      - media:/srv/erp/media
      - static:/srv/erp/static
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/var/lib/postgresql/data]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; r=u.Request('http://127.0.0.1:8000/health/ready', headers={'Host':os.environ['ERP_HOST'],'X-Forwarded-Proto':'https'}); assert u.urlopen(r, timeout=3).status==200"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [front, data, mail]

  migrate:
    image: erp-backbone:${ERP_RELEASE:-2.8.1}
    pull_policy: never
    environment: *erp-environment
    command: [sh, -ec, "python manage.py erp_preflight && python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    volumes: [media:/srv/erp/media, static:/srv/erp/static]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  redis:
    image: redis:8.2.11-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  worker:
    image: erp-backbone:${ERP_RELEASE:-2.8.1}
    pull_policy: never
    environment: *erp-environment
    command: [celery, -A, backbone.celeryapp:app, worker, -Q, notifications, --concurrency=2, --loglevel=INFO]
    restart: unless-stopped
    stop_grace_period: 35s
    volumes: [media:/srv/erp/media]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [data, mail]

  marketing-worker:
    image: erp-backbone:${ERP_RELEASE:-2.8.1}
    pull_policy: never
    environment: *erp-environment
    command: [celery, -A, backbone.celeryapp:app, worker, -Q, marketing, --concurrency=2, --loglevel=INFO]
    restart: unless-stopped
    stop_grace_period: 35s
    volumes: [media:/srv/erp/media]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [data, mail]

  outbox-dispatcher:
    image: erp-backbone:${ERP_RELEASE:-2.8.1}
    pull_policy: never
    environment: *erp-environment
    command: [python, manage.py, erp_dispatch_outbox]
    restart: unless-stopped
    volumes: [media:/srv/erp/media]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [data]

  nginx:
    image: nginx:1.30.6-trixie
    restart: unless-stopped
    ports:
      - "${ERP_BIND_ADDRESS:-127.0.0.1}:${ERP_HTTP_PORT:-80}:80"
      - "${ERP_BIND_ADDRESS:-127.0.0.1}:${ERP_HTTPS_PORT:-443}:443"
    environment:
      ERP_HOST: ${ERP_HOST:?Set ERP_HOST}
      ERP_AUTHORITY: ${ERP_AUTHORITY:?Set ERP_AUTHORITY}
      NGINX_ENVSUBST_FILTER: "^ERP_(HOST|AUTHORITY)$"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/erp-proxy.conf:/etc/nginx/erp-proxy.conf:ro
      - "${ERP_TLS_DIR:?Set ERP_TLS_DIR}:/etc/nginx/tls:ro"
      - static:/srv/erp/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [front]

networks:
  front:
  mail:
  data:
    internal: true
volumes:
  postgres:
  redis_data:
  media:
  static:
