  /marketing/campaigns/{id}/send:
    post:
      tags:
      - Marketing
      summary: Queue an approved campaign for immediate sending
      description: Requires marketing.admin at the campaign site. Uses the server
        UTC time and schedules outbox deliveries.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Campaign queued with status scheduled and updated revision
        '200':
          description: Identical request replay
        '404':
          description: Campaign unavailable in the caller's marketing.admin scope
        '409':
          description: Revision conflict
          invalid state or provider preflight failure: null
