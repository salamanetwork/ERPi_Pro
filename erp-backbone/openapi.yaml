      - Publication
      summary: List working entries or create a draft
      responses:
        '200':
          description: Successful response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                working_slug:
                  type: string
                entry_type:
                  type: string
                  enum:
                  - post
                  - page
                locale:
                  type: string
                  enum:
                  - en
                  - ar
                working_data:
                  type: object
                translation_of:
                  type: string
                  format: uuid
