      type: object
      required:
      - name
      - tag
      properties:
        name:
          type: string
          maxLength: 120
        tag:
          type: string
          maxLength: 60
        site_id:
          type: integer
          format: int64
          nullable: true
    Asset:
      allOf:
      - $ref: '#/components/schemas/AssetInput'
      - type: object
        required:
        - id
        - site_id
        properties:
          id:
            type: integer
            format: int64
    OrderInput:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        site_id:
          type: integer
          format: int64
          nullable: true
        asset_reference:
          type: integer
          format: int64
          nullable: true
    Revision:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          minimum: 1
    Order:
      allOf:
      - $ref: '#/components/schemas/OrderInput'
      - $ref: '#/components/schemas/Revision'
      - type: object
        required:
        - id
        - description
        - site_id
        - status
        - asset_reference
        - asset_snapshot
        - created_at
        - submitted_at
        properties:
          id:
            type: integer
            format: int64
          status:
            type: string
            enum:
            - draft
            - submitted
            - in_review
            - approved
          asset_snapshot:
            type: string
          created_at:
            type: string
            format: date-time
          submitted_at:
            type: string
            format: date-time
            nullable: true
          can_review:
            type: boolean
          review_routing:
            type: object
            description: Current pinned role and eligible usernames. Included only
              for administrators on pending work orders.
            required:
            - role_id
            - role_name
            - eligible_reviewers
            properties:
              role_id:
                type: integer
                format: int64
              role_name:
                type: string
              eligible_reviewers:
                type: array
                items:
                  type: string
          approval_runs:
            type: array
            items:
              $ref: '#/components/schemas/ApprovalRun'
    ApprovalRun:
      type: object
      properties:
        version:
          type: integer
        outcome:
          type: string
          enum:
          - pending
          - approved
          - returned
        submitted_by:
          type: string
        submitted_at:
          type: string
          format: date-time
        steps:
          type: array
          items:
            type: string
        next_step:
          type: integer
          minimum: 0
        decisions:
          type: array
          items:
            type: object
            properties:
              step:
                type: integer
                minimum: 0
              actor:
                type: string
              action:
                type: string
                enum:
                - approve
                - return
              reason:
                type: string
              decided_at:
                type: string
                format: date-time
              delegation_id:
                type: integer
                nullable: true
