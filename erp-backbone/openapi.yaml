components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sessionid
    CustomerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CustomerRefresh:
      type: apiKey
      in: cookie
      name: erpi_customer_refresh
  requestBodies:
    CsvUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - file
            properties:
              file:
                type: string
                format: binary
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Request the paginated envelope on endpoints with legacy item lists.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DirectorySearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    DirectoryStatus:
      name: status
      in: query
      schema:
        type: string
      description: Supported status depends on the directory.
    SavedViewScreen:
      name: screen
      in: path
      required: true
      schema:
        type: string
        enum:
        - inbox
        - work-orders
        - purchase-requests
        - purchase-orders
        - goods-receipts
        - sales-documents
        - reports-finance
        - reports-stock
        - reports-sales
        - reports-maintenance
        - budget-vs-actual
    CsvMasterKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - asset
        - unit
        - item
        - warehouse
        - location
        - supplier
        - customer
    DocumentKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - pr
        - po
        - grn
        - si
    Csrf:
      name: X-CSRFToken
      in: header
      required: true
      schema:
        type: string
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    DirectoryPage:
      description: Paginated directory with total count and links. Legacy employee
        clients without page still receive the items envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DirectoryPagination'
    SavedView:
      description: Personal saved view
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SavedView'
    CsvFile:
      description: UTF-8 CSV with BOM
      content:
        text/csv:
          schema:
            type: string
    CsvImportResult:
      description: Row count and field-level validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CsvImportResult'
    ExperienceNotifications:
      description: Visible notification feed with up to 100 rows and unread count
      content:
        application/json:
          schema:
            type: object
            properties:
              unread:
                type: integer
                minimum: 0
              items:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    number:
                      type: string
                    route:
                      type: string
                    event:
                      type: string
                    read:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
    PurchaseOrder:
      description: Purchase order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseOrder'
    Supplier:
      description: Saved supplier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Supplier'
    Attachment:
      description: Saved attachment or successful replay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Attachment'
    PrintLayout:
      description: Current print layout and revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrintLayout'
    PurchaseRecord:
      description: Purchase requisition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseRecord'
    Problem:
      description: Request could not be completed
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
                description: Existing operation error code
              field_errors:
                type: object
                description: Field names use request keys. Repeated rows use zero-based
                  paths such as lines.1.quantity.
                additionalProperties:
                  type: array
                  items:
                    type: string
              field_error_codes:
                type: object
                description: Stable localization codes in the same order as each field's
                  messages
                additionalProperties:
                  type: array
                  items:
                    type: string
    Asset:
      description: Saved asset or successful replay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Asset'
    Order:
      description: Work order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
  schemas:
    CrmLeadInput:
      type: object
      properties:
        site_id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
          maxLength: 120
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        source:
          type: string
        state:
          type: string
          enum:
          - new
          - qualified
          - disqualified
        revision:
          type: integer
    CrmOpportunityInput:
      type: object
      properties:
        site_id:
          type: integer
        owner_id:
          type: integer
        customer_id:
          type: integer
        title:
          type: string
          maxLength: 160
        estimated_amount:
          type: string
        currency:
          type: string
          example: AED
        expected_close:
          type: string
          format: date
        revision:
          type: integer
    CrmStageChange:
      type: object
      required:
      - revision
      - stage_id
      properties:
        revision:
          type: integer
        stage_id:
          type: integer
        reason:
          type: string
          maxLength: 500
    CrmCustomerLink:
      type: object
      required:
      - revision
      - customer_id
      properties:
        revision:
          type: integer
        customer_id:
          type: integer
    CrmCustomerInput:
      type: object
      required:
      - revision
      - name
      properties:
        revision:
          type: integer
        name:
          type: string
        legal_name:
          type: string
        contact:
          type: string
        billing:
          type: string
        shipping:
          type: string
        tax_id:
          type: string
        terms:
          type: integer
          minimum: 0
          maximum: 365
    CrmDecision:
      type: object
      required:
      - revision
      - action
      properties:
        revision:
          type: integer
        action:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
    CrmQuotationInput:
      type: object
      required:
      - revision
      - date
      - expires
      - lines
      properties:
        revision:
          type: integer
        date:
          type: string
          format: date
        expires:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - item_id
            - quantity
            - price
            properties:
              item_id:
                type: integer
              quantity:
                type: string
              price:
                type: string
    CrmActivityInput:
      type: object
      properties:
        lead_id:
          type: integer
        opportunity_id:
          type: integer
        owner_id:
          type: integer
        title:
          type: string
        notes:
          type: string
        kind:
          type: string
          enum:
          - call
          - meeting
          - task
          - note
        due_at:
          type: string
          format: date-time
          nullable: true
        action:
          type: string
          enum:
          - edit
          - complete
          - cancel
        revision:
          type: integer
    CrmStageInput:
      type: object
      properties:
        code:
          type: string
        name_en:
          type: string
        name_ar:
          type: string
        order:
          type: integer
        active:
          type: boolean
        revision:
          type: integer
    DashboardDrillFilters:
      type: object
      description: Canonical query parameters used by the chart or its detail report.
      additionalProperties:
        type: string
    DashboardCurrencies:
      type: object
      description: Decimal totals keyed by ISO currency code.
      additionalProperties:
        type: string
    DashboardAging:
      type: object
      required:
      - filters
      - series
      properties:
        filters:
          $ref: '#/components/schemas/DashboardDrillFilters'
        series:
          type: array
          items:
            type: object
            required:
            - currency
            - total
            - points
            properties:
              currency:
                type: string
              total:
                type: string
              points:
                type: array
                items:
                  type: object
                  required:
                  - bucket
                  - value
                  - filters
                  properties:
                    bucket:
                      type: string
                      enum:
                      - current
                      - 1-30
                      - 31-60
                      - 61-90
                      - 90+
                      - credit
                    value:
                      type: string
                    filters:
                      $ref: '#/components/schemas/DashboardDrillFilters'
    CompanyBrand:
      type: object
      required:
      - name
      - logo_url
      - revision
      properties:
        name:
          type: string
          maxLength: 120
        logo_url:
          type: string
          nullable: true
        revision:
          type: integer
          minimum: 0
    DirectoryPagination:
      type: object
      required:
      - count
      - next
      - previous
      - results
      - page
      - page_size
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        results:
          type: array
          items:
            type: object
    AttendanceEmpty:
      type: object
      example: {}
    AttendanceSessionInput:
      type: object
      required:
      - session_id
      properties:
        session_id:
          type: integer
          format: int64
    AttendancePolicyInput:
      type: object
      required:
      - week_start
      - standard_minutes
      - revision
      properties:
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          description: Monday is zero
        standard_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 480
        revision:
          type: integer
          minimum: 0
    AttendanceWeekInput:
      type: object
      required:
      - week_start
      properties:
        week_start:
          type: string
          format: date
    AttendanceReviewInput:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
        reason:
          type: string
          maxLength: 500
          description: Required for return or reopen
        overtime:
          type: object
          description: Keyed by local date YYYY-MM-DD. Minutes requested at submit
            or granted at approve
          additionalProperties:
            type: object
            required:
            - minutes
            properties:
              minutes:
                type: integer
                minimum: 0
              reason:
                type: string
                maxLength: 500
                description: Required for requests and reductions
    AttendanceCorrectionInput:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 500
        started_at:
          $ref: '#/components/schemas/AttendanceLocalTime'
        ended_at:
          $ref: '#/components/schemas/AttendanceLocalTime'
        breaks:
          type: array
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
              started_at:
                $ref: '#/components/schemas/AttendanceLocalTime'
              ended_at:
                $ref: '#/components/schemas/AttendanceLocalTime'
    AttendanceLocalTime:
      type: string
      description: Site-local ISO timestamp, with a matching numeric UTC offset required
        for a repeated hour
      example: 2026-11-01T01:30-04:00
    CostCenterCreate:
      type: object
      required:
      - site_id
      - code
      - name
      properties:
        site_id:
          type: integer
        code:
          type: string
          maxLength: 24
        name:
          type: string
          maxLength: 120
    CostCenterEdit:
      type: object
      required:
      - site_id
      - name
      - revision
      - active
      properties:
        site_id:
          type: integer
        name:
          type: string
          maxLength: 120
        revision:
          type: integer
          minimum: 0
        active:
          type: boolean
    BudgetValues:
      type: object
      required:
      - months
      properties:
        months:
          type: object
          description: Keys 1 to 12. Omitted month is unbudgeted; zero is an explicit
            budget.
          minProperties: 1
          maxProperties: 12
          additionalProperties:
            type: string
